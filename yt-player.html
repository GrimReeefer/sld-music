<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>SLD Loading Screen Player</title>
<!--
    South Line District RP — YouTube bridge for the FiveM loading screen (sd_loadingscreen)

    WHY THIS FILE EXISTS
    FiveM opens loading screens from a nui:// address. Browsers send no Referer header from
    that kind of address, and YouTube refuses to play embeds without one (error 153).
    This page lives on a normal website, so YouTube accepts it. The loading screen embeds
    this page, and this page embeds YouTube. Controls go back and forth with postMessage.

    HOSTING
    Upload this single file anywhere on the website, publicly reachable with no login,
    e.g.  https://www.sld-rp.com/yt-player.html
    then set  music.youtubeBridge  in html/config.js of sd_loadingscreen to that URL.
    Nothing else is needed. The page shows nothing on its own except black.
-->
<style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #p { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
(function () {
    'use strict';
    var parentWin = window.parent;
    if (parentWin === window) { document.body.innerHTML = '<p style="color:#888;font:14px sans-serif;padding:20px">This page is the music bridge for the South Line District RP loading screen. It does nothing on its own.</p>'; return; }

    var player = null, ready = false, queue = [], timer = null;

    function send(msg) { try { parentWin.postMessage(Object.assign({ sd: 'event' }, msg), '*'); } catch (e) {} }

    function pushTime() {
        if (!player || !ready) return;
        try {
            send({ type: 'time', cur: player.getCurrentTime() || 0, dur: player.getDuration() || 0, muted: !!player.isMuted(), volume: player.getVolume() });
        } catch (e) {}
    }

    function run(name, args) {
        if (!player || !ready) { queue.push([name, args]); return; }
        try {
            if (typeof player[name] === 'function') player[name].apply(player, args || []);
            if (name === 'loadVideoById' || name === 'cueVideoById') send({ type: 'title', title: '' });
        } catch (e) {}
        if (name === 'setVolume' || name === 'mute' || name === 'unMute' || name === 'seekTo') pushTime();
    }

    var initialId = null;
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.sd !== 'cmd' || e.source !== parentWin) return;
        if (d.name === 'init') { initialId = d.args && d.args[0]; create(); return; }
        run(d.name, d.args);
    });

    // YouTube can still switch auto-generated captions on despite cc_load_policy: 0,
    // so unload the captions module whenever a video starts.
    function noCaptions() {
        if (!player) return;
        try { player.setOption('captions', 'track', {}); } catch (e) {}
        try { player.unloadModule('captions'); } catch (e) {}
        try { player.unloadModule('cc'); } catch (e) {}
    }

    var created = false;
    function create() {
        if (created) return;
        created = true;
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        tag.onerror = function () { send({ type: 'error', code: 'api' }); };
        document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('p', {
            width: '100%', height: '100%',
            videoId: initialId || undefined,
            host: 'https://www.youtube-nocookie.com',
            playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, cc_load_policy: 0, origin: window.location.origin },
            events: {
                onReady: function () {
                    ready = true;
                    noCaptions();
                    send({ type: 'ready' });
                    while (queue.length) { var q = queue.shift(); run(q[0], q[1]); }
                    clearInterval(timer); timer = setInterval(pushTime, 500);
                },
                onStateChange: function (ev) {
                    if (ev.data === 1 || ev.data === 3) noCaptions(); // playing / buffering (new video)
                    var title = '';
                    try { var vd = player.getVideoData(); title = (vd && vd.title) || ''; } catch (e) {}
                    send({ type: 'state', data: ev.data, title: title });
                    pushTime();
                },
                onError: function (ev) { send({ type: 'error', code: ev.data }); }
            }
        });
    };

    // Tell the loading screen we're loaded so it can send 'init'
    send({ type: 'hello' });
})();
</script>
</body>
</html>
